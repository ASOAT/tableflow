<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TableFlow · 同源 iframe 数据</title>
    <style>
      body { margin: 16px; font-family: system-ui, sans-serif; color: #243244; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #ccd5e0; padding: 10px 12px; text-align: left; }
      th { background: #edf2f8; }
      p { margin-top: 0; font-size: 14px; }
    </style>
  </head>
  <body>
    <p>这是同源子页面中的数据表。</p>
    <table>
      <thead><tr><th>编号</th><th>项目</th><th>数量</th></tr></thead>
      <tbody><tr><td>F001</td><td>显示器</td><td>2</td></tr><tr><td>F002</td><td>键盘</td><td>4</td></tr></tbody>
    </table>
  </body>
</html>
