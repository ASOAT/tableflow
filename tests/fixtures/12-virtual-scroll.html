<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TableFlow · 12 虚拟滚动与节点复用</title>
<style>:root{font-family:system-ui,sans-serif;color:#243244;background:#f5f7fa}body{max-width:1100px;margin:32px auto;padding:0 24px 40px}h1{font-size:24px}p{line-height:1.65}table{border-collapse:collapse;margin:12px 0;min-width:480px;background:white}th,td{border:1px solid #cbd5e1;padding:9px 12px;text-align:left;vertical-align:top}th{background:#eaf0f7}.panel{padding:16px;border:1px solid #cbd5e1;background:white;margin:16px 0}.grid-line{display:grid;grid-template-columns:repeat(3,180px)}.grid-line>div,.grid-line>span{border:1px solid #cbd5e1;padding:9px 12px;background:white}.grid-line.header>div,.grid-line.header>span{font-weight:600;background:#eaf0f7}[hidden]{display:none!important}.hidden{display:none}.muted{color:#617188}.breaks{white-space:pre-line}button{padding:5px 9px}iframe{width:750px;height:240px;border:1px solid #cbd5e1}
.virtual-grid{width:660px;border:1px solid #cbd5e1;background:white}.virtual-viewport{height:480px;overflow-y:auto;position:relative;overscroll-behavior:contain}.virtual-spacer{height:2880px;position:relative}.virtual-line{display:grid;grid-template-columns:260px 240px 160px;height:24px;box-sizing:border-box}.virtual-line>div{height:24px;padding:2px 10px;border-bottom:1px solid #dde5ee;border-right:1px solid #dde5ee;box-sizing:border-box}.virtual-line.header{height:32px;position:sticky;top:0;background:#eaf0f7;font-weight:700}.virtual-line.header>div{height:32px;padding-top:6px}.virtual-line.slot{position:absolute;left:0;right:0}</style>
</head>
<body>
<h1>12 虚拟滚动与节点复用</h1>
<p>只有 20 个数据行 DOM 节点，用 aria-rowindex 与 data-row-key 标明实际身份。120 条数据中含合法重复值。</p>
<div class="virtual-grid" role="grid" aria-label="虚拟库存" aria-rowcount="121" aria-colcount="3">
<div class="virtual-line header" role="row" aria-rowindex="1"><div role="columnheader" aria-colindex="1">商品</div><div role="columnheader" aria-colindex="2">批次</div><div role="columnheader" aria-colindex="3">数量</div></div>
<div class="virtual-viewport"><div class="virtual-spacer"></div></div>
</div><p class="muted">采集结束后滚动位置应恢复。重复商品不是重复节点，不能按整行文字删掉。</p>
<script>
(() => {
  const viewport = document.querySelector('.virtual-viewport');
  const spacer = document.querySelector('.virtual-spacer');
  const slots = Array.from({length:20}, () => {
    const row = document.createElement('div');
    row.className = 'virtual-line slot';
    row.setAttribute('role','row');
    for (let col = 1; col <= 3; col += 1) {
      const cell = document.createElement('div');
      cell.setAttribute('role','gridcell');
      cell.setAttribute('aria-colindex',String(col));
      row.append(cell);
    }
    spacer.append(row);
    return row;
  });
  function render() {
    const start = Math.min(100, Math.floor(viewport.scrollTop / 24));
    slots.forEach((row, slot) => {
      const index = start + slot;
      row.setAttribute('aria-rowindex',String(index + 2));
      row.dataset.rowKey = 'record-' + (index + 1);
      row.style.top = (index * 24) + 'px';
      const values = index % 10 === 0 ? ['重复商品','相同值','7'] : ['商品 ' + (index + 1),'批次 ' + (Math.floor(index / 10) + 1),String(index + 1)];
      values.forEach((value, col) => { row.children[col].textContent = value; });
    });
  }
  let pending;
  viewport.addEventListener('scroll', () => {
    clearTimeout(pending);
    pending = setTimeout(() => requestAnimationFrame(render), 10);
  });
  render();
})();
</script>
</body>
</html>
