<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TableFlow · 06 Ant Design 风格 DOM</title>
<style>:root{font-family:system-ui,sans-serif;color:#243244;background:#f5f7fa}body{max-width:1100px;margin:32px auto;padding:0 24px 40px}h1{font-size:24px}p{line-height:1.65}table{border-collapse:collapse;margin:12px 0;min-width:480px;background:white}th,td{border:1px solid #cbd5e1;padding:9px 12px;text-align:left;vertical-align:top}th{background:#eaf0f7}.panel{padding:16px;border:1px solid #cbd5e1;background:white;margin:16px 0}.grid-line{display:grid;grid-template-columns:repeat(3,180px)}.grid-line>div,.grid-line>span{border:1px solid #cbd5e1;padding:9px 12px;background:white}.grid-line.header>div,.grid-line.header>span{font-weight:600;background:#eaf0f7}[hidden]{display:none!important}.hidden{display:none}.muted{color:#617188}.breaks{white-space:pre-line}button{padding:5px 9px}iframe{width:750px;height:240px;border:1px solid #cbd5e1}
.ant-table-container{position:relative;width:700px}.ant-table-container table{width:800px;table-layout:fixed;min-width:0;margin:0}.ant-table-fixed-left{position:absolute;left:0;top:0;width:300px;background:white;box-shadow:3px 0 5px #ccd5e0}.ant-table-fixed-left table{width:300px}.ant-table th,.ant-table td{height:42px;box-sizing:border-box}.ant-table-expanded-row{height:54px}.ant-pagination{padding:12px}</style>
</head>
<body>
<h1>06 Ant Design 风格 DOM</h1>
<p>模拟当前分页内的数据；选择列保留空位置，展开详情不混入数据，固定列 clone 不重复导出。</p>
<div class="ant-table-wrapper"><div class="ant-table ant-table-fixed-header"><div class="ant-table-container">
<div class="ant-table-header"><table><thead><tr><th aria-colindex="1"><input type="checkbox" aria-label="全选"></th><th aria-colindex="2">商品</th><th aria-colindex="3">数量</th><th aria-colindex="4">状态</th></tr></thead></table></div>
<div class="ant-table-body" style="overflow:auto;max-height:220px"><table><tbody><tr data-row-key="order-1" aria-rowindex="2"><td aria-colindex="1"><input type="checkbox" aria-label="选择第一行"></td><td aria-colindex="2">笔记本</td><td aria-colindex="3">12</td><td aria-colindex="4">已发货</td></tr>
<tr class="ant-table-expanded-row"><td colspan="4"><div>展开详情：包裹追踪说明，不是数据行。</div></td></tr>
<tr data-row-key="order-2" aria-rowindex="3"><td aria-colindex="1"><input type="checkbox" aria-label="选择第二行"></td><td aria-colindex="2">文件夹</td><td aria-colindex="3">5</td><td aria-colindex="4">待发货</td></tr></tbody><tfoot class="ant-table-summary"><tr><td aria-colindex="1"></td><td aria-colindex="2">合计</td><td aria-colindex="3">17</td><td aria-colindex="4"></td></tr></tfoot></table></div>
<div class="ant-table-fixed-left"><div class="ant-table-header"><table><thead><tr><th aria-colindex="1"><input type="checkbox" aria-label="全选固定列"></th><th aria-colindex="2">商品</th></tr></thead></table></div><div class="ant-table-body"><table><tbody><tr data-row-key="order-1" aria-rowindex="2"><td aria-colindex="1"><input type="checkbox" aria-label="选择"></td><td aria-colindex="2">笔记本</td></tr><tr data-row-key="order-2" aria-rowindex="3"><td aria-colindex="1"><input type="checkbox" aria-label="选择"></td><td aria-colindex="2">文件夹</td></tr></tbody></table></div></div>
</div></div><nav class="ant-pagination" aria-label="分页">第 2 页 / 共 5 页（仅当前页数据）</nav></div>

</body>
</html>
