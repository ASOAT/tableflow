<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TableFlow · 13 固定列分片</title>
<style>:root{font-family:system-ui,sans-serif;color:#243244;background:#f5f7fa}body{max-width:1100px;margin:32px auto;padding:0 24px 40px}h1{font-size:24px}p{line-height:1.65}table{border-collapse:collapse;margin:12px 0;min-width:480px;background:white}th,td{border:1px solid #cbd5e1;padding:9px 12px;text-align:left;vertical-align:top}th{background:#eaf0f7}.panel{padding:16px;border:1px solid #cbd5e1;background:white;margin:16px 0}.grid-line{display:grid;grid-template-columns:repeat(3,180px)}.grid-line>div,.grid-line>span{border:1px solid #cbd5e1;padding:9px 12px;background:white}.grid-line.header>div,.grid-line.header>span{font-weight:600;background:#eaf0f7}[hidden]{display:none!important}.hidden{display:none}.muted{color:#617188}.breaks{white-space:pre-line}button{padding:5px 9px}iframe{width:750px;height:240px;border:1px solid #cbd5e1}
.ant-table-container{display:flex;width:820px;background:white}.ant-table-container table{min-width:0;width:100%;table-layout:fixed;margin:0}.ant-table-fixed-left,.ant-table-fixed-right{width:170px;flex:0 0 170px}.center-pane{width:480px;overflow-x:auto}.ant-table-container td,.ant-table-container th{height:42px;box-sizing:border-box}</style>
</head>
<body>
<h1>13 固定列分片</h1>
<p>中间物理表仅含商品和数量，编号和状态来自左右分片。按行 key 与列索引合成 4 列。</p>
<div class="ant-table-wrapper"><div class="ant-table"><div class="ant-table-container">
<div class="ant-table-fixed-left"><div class="ant-table-header"><table><thead><tr><th aria-colindex="1" data-column-key="c1">编号</th></tr></thead></table></div><div class="ant-table-body"><table><tbody><tr data-row-key="fixed-1" aria-rowindex="2"><td aria-colindex="1" data-column-key="c1">FX01</td></tr><tr data-row-key="fixed-2" aria-rowindex="3"><td aria-colindex="1" data-column-key="c1">FX02</td></tr></tbody></table></div></div>
<div class="center-pane"><div class="ant-table-header"><table><thead><tr><th aria-colindex="2" data-column-key="c2">商品</th><th aria-colindex="3" data-column-key="c3">数量</th></tr></thead></table></div><div class="ant-table-body"><table><tbody><tr data-row-key="fixed-1" aria-rowindex="2"><td aria-colindex="2" data-column-key="c2">胶带</td><td aria-colindex="3" data-column-key="c3">3</td></tr><tr data-row-key="fixed-2" aria-rowindex="3"><td aria-colindex="2" data-column-key="c2">订书机</td><td aria-colindex="3" data-column-key="c3">2</td></tr></tbody></table></div></div>
<div class="ant-table-fixed-right"><div class="ant-table-header"><table><thead><tr><th aria-colindex="4" data-column-key="c4">状态</th></tr></thead></table></div><div class="ant-table-body"><table><tbody><tr data-row-key="fixed-1" aria-rowindex="2"><td aria-colindex="4" data-column-key="c4">可用</td></tr><tr data-row-key="fixed-2" aria-rowindex="3"><td aria-colindex="4" data-column-key="c4">缺货</td></tr></tbody></table></div></div>
</div></div></div>

</body>
</html>
