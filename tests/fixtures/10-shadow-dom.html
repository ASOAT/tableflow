<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TableFlow · 10 Shadow DOM</title>
<style>:root{font-family:system-ui,sans-serif;color:#243244;background:#f5f7fa}body{max-width:1100px;margin:32px auto;padding:0 24px 40px}h1{font-size:24px}p{line-height:1.65}table{border-collapse:collapse;margin:12px 0;min-width:480px;background:white}th,td{border:1px solid #cbd5e1;padding:9px 12px;text-align:left;vertical-align:top}th{background:#eaf0f7}.panel{padding:16px;border:1px solid #cbd5e1;background:white;margin:16px 0}.grid-line{display:grid;grid-template-columns:repeat(3,180px)}.grid-line>div,.grid-line>span{border:1px solid #cbd5e1;padding:9px 12px;background:white}.grid-line.header>div,.grid-line.header>span{font-weight:600;background:#eaf0f7}[hidden]{display:none!important}.hidden{display:none}.muted{color:#617188}.breaks{white-space:pre-line}button{padding:5px 9px}iframe{width:750px;height:240px;border:1px solid #cbd5e1}
open-inventory,opaque-grid{display:block;min-width:500px;min-height:70px;margin:18px 0;border:1px solid #cbd5e1;background:white}</style>
</head>
<body>
<h1>10 Shadow DOM</h1>
<p>open host 可读取；closed host 无法通过标准 DOM API 读取，仅能据 host 语义给出“可能 closed”的诊断。</p>
<open-inventory></open-inventory><opaque-grid role="grid" aria-label="不透明结构化组件" aria-rowcount="3" aria-colcount="2"></opaque-grid>
<script>
(() => {
  const open = document.querySelector('open-inventory').attachShadow({mode:'open'});
  open.innerHTML = '<style>table{border-collapse:collapse;font:16px system-ui}th,td{border:1px solid #cbd5e1;padding:10px 20px}</style><table><thead><tr><th>设备</th><th>数量</th></tr></thead><tbody><tr><td>显示器</td><td>2</td></tr><tr><td>键盘</td><td>4</td></tr></tbody></table>';
  const closed = document.querySelector('opaque-grid').attachShadow({mode:'closed'});
  closed.innerHTML = '<p>封闭的内部数据</p><table><tr><th>内部</th><th>数量</th></tr><tr><td>不可读取</td><td>99</td></tr></table>';
})();
</script>
</body>
</html>
